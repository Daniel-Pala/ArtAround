<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<title>Palazzo Pepoli Campogrande - piantina schematica</title>
<rect x="0" y="0" width="100" height="100" fill="#F4F1E9"/>
<!-- atrio: si entra dallo scalone -->
<path id="atrio" d="M26 25 H64.5 V53.5 H36 V33 H26 Z" fill="#E6E1D5" stroke="#8a7f6d" stroke-width="0.6">
<title>Atrio e scalone</title>
</path>
<!-- le cinque sale, nell'ordine di visita del museo -->
<g fill="#F7F4EC" stroke="#8a7f6d" stroke-width="0.6">
<rect id="sala-1" x="64.5" y="25" width="30.5" height="50">
<title>1. Salone d'onore</title>
</rect>
<rect id="sala-2" x="40.5" y="53.5" width="24" height="21.5">
<title>2. Sala di Felsina</title>
</rect>
<rect id="sala-3" x="23" y="53.5" width="17.5" height="21.5">
<title>3. Sala delle Stagioni</title>
</rect>
<path id="sala-4" d="M5 53.5 H13.5 V49 H19.5 V53.5 H23 V75 H5 Z">
<title>4. Sala dell'Olimpo</title>
</path>
<rect id="sala-5" x="5" y="25" width="21" height="24">
<title>5. Sala di Alessandro</title>
</rect>
</g>
<!-- i nomi stanno in alto in ogni sala, dove non arrivano i segnaposti; nelle sale strette vanno su due righe -->
<g fill="#8A7F70" font-family="sans-serif" font-size="2.3" text-anchor="middle">
<text x="79.75" y="30">Salone d'onore</text>
<text x="52.5" y="58">Sala di Felsina</text>
<text x="31.75" y="57.5">Sala delle</text>
<text x="31.75" y="60">Stagioni</text>
<text x="14" y="57.5">Sala</text>
<text x="14" y="60">dell'Olimpo</text>
<text x="15.5" y="29">Sala di</text>
<text x="15.5" y="31.5">Alessandro</text>
<text x="50" y="45">Atrio</text>
</g>
<!-- ingresso: si entra dall'alto nell'atrio e si gira a destra verso il Salone d'onore -->
<path d="M50.5 17 V29.5 H62.5" fill="none" stroke="#8a7f6d" stroke-width="0.6"/>
<path d="M62 28 L65 29.5 L62 31 Z" fill="#8a7f6d"/>
<text x="50.5" y="15" fill="#8A7F70" font-family="sans-serif" font-size="2.6" text-anchor="middle">Ingresso</text>
</svg>
