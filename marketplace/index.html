<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround - Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="text-primary">Dashboard Marketplace</h1>
                <p class="lead text-muted">Benvenuto, Docente. Gestisci i musei e configura le visite.</p>
            </div>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuovoMuseo">
                + Aggiungi Nuovo Museo
            </button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Museo</th>
                            <th>Città</th>
                            <th class="text-end">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="tabella-musei">
                        <tr><td colspan="3" class="text-center">Caricamento musei in corso...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuovoMuseo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registra Nuovo Museo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formCreaMuseo">
                        <div class="mb-3">
                            <label for="nomeMuseo" class="form-label">Nome del Museo *</label>
                            <input type="text" class="form-control" id="nomeMuseo" placeholder="es. Galleria Borghese" required>
                        </div>
                        <div class="mb-3">
                            <label for="cittaMuseo" class="form-label">Città</label>
                            <input type="text" class="form-control" id="cittaMuseo" placeholder="es. Roma">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salva nel Database</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
