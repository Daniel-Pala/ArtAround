<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .card-museo { transition: transform 0.2s, box-shadow 0.2s; border: none; }
        .card-museo:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .stats-card { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-bank2 me-2"></i>ArtAround</span>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card stats-card shadow-sm p-3">
                    <div class="text-muted small uppercase fw-bold">Musei Gestiti</div>
                    <div class="h3 mb-0" id="countMusei">0</div>
                </div>
            </div>
            <div class="col-md-8 text-end d-flex align-items-center justify-content-end">
                <button class="btn btn-success btn-lg shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuovoMuseo">
                    <i class="bi bi-plus-circle me-2"></i>Aggiungi Nuovo Museo
                </button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 text-dark">I tuoi Musei</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Museo</th>
                                <th>Città</th>
                                <th class="text-end pe-4">Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="listaMusei">
                            <tr>
                                <td colspan="3" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"></div>
                                    Caricamento musei...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuovoMuseo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuovo Museo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formMuseo">
                        <div class="mb-3">
                            <label class="form-label">Nome Museo</label>
                            <input type="text" id="nomeMuseo" class="form-control" placeholder="es. Galleria Borghese" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Città</label>
                            <input type="text" id="cittaMuseo" class="form-control" placeholder="es. Roma" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salva Museo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
