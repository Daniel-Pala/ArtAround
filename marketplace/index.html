<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ArtAround - Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-primary">Dashboard Marketplace</h1>
        <p class="lead">Benvenuto, Docente. Seleziona un museo per configurare la visita.</p>

        <table class="table table-white table-striped mt-4">
            <thead>
                <tr>
                    <th>Museo</th>
                    <th>Città</th>
                    <th>Azioni</th>
                </tr>
            </thead>
            <tbody id="tabella-musei">
                <tr><td colspan="3">Caricamento musei in corso...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
