<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="stile.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-5">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-palette me-2"></i>ArtAround</span>
            <div id="userBox" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <div class="container">

        <!-- ============ VISTA AUTORE ============ -->
        <div id="sezioneAutore" style="display: none;">
            <div class="section-head d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
                <div>
                    <div class="eyebrow">Catalogo</div>
                    <h1 class="section-title">Musei</h1>
                    <p class="section-sub mb-0 mt-2"><span id="countMusei">0</span> musei nel catalogo condiviso.</p>
                </div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuovoMuseo">
                    <i class="bi bi-plus-lg me-2"></i>Aggiungi museo
                </button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">Museo</th>
                                <th>Città</th>
                                <th class="text-end pe-4">Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="listaMusei">
                            <tr>
                                <td colspan="3" class="text-center py-5 text-muted">Caricamento musei…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ============ VISTA VISITATORE ============ -->
        <div id="sezioneVisitatore" style="display: none;">
            <div class="section-head mb-4">
                <h1 class="section-title">Visite guidate</h1>
                <p class="section-sub mb-0 mt-2">Scegli un percorso, sbloccalo e inizia la visita dal tuo dispositivo.</p>
            </div>

            <div class="row g-4" id="listaVisite">
                <div class="col-12 text-muted">Caricamento percorsi…</div>
            </div>
        </div>
    </div>

    <!-- ============ MODALE NUOVO MUSEO ============ -->
    <div class="modal fade" id="modalNuovoMuseo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuovo museo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formMuseo">
                        <div class="mb-3">
                            <label class="form-label">Nome del museo</label>
                            <input type="text" id="nomeMuseo" class="form-control" placeholder="es. Galleria Borghese" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Città</label>
                            <input type="text" id="cittaMuseo" class="form-control" placeholder="es. Roma" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Salva museo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODALE NUOVA OPERA ============ -->
    <div class="modal fade" id="modalNuovoItem" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Aggiungi item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                    <form id="formItem">
                        <div class="mb-3">
                            <label class="form-label">Titolo dell'item</label>
                            <input type="text" id="itemTitolo" class="form-control" placeholder="es. Ritratto di Giulio II" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">ID Wikidata</label>
                            <input type="text" id="itemWikidata" class="form-control" placeholder="es. Q126599960" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Licenza</label>
                            <select id="itemLicenza" class="form-select" required>
                                <option value="">Seleziona una licenza</option>
                                <option value="CC-BY">CC-BY</option>
                                <option value="CC-BY-SA">CC-BY-SA</option>
                                <option value="CC0">CC0 (pubblico dominio)</option>
                                <option value="Proprietaria">Proprietaria</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Prezzo (€)</label>
                            <input type="number" id="itemPrezzo" class="form-control" min="0" step="0.01" value="0">
                        </div>

                        <hr>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label class="form-label mb-0 fw-semibold">Testi</label>
                            <button type="button" class="btn btn-sm btn-outline-success" onclick="aggiungiRigaTesto()">
                                <i class="bi bi-plus-lg me-1"></i>Aggiungi testo
                            </button>
                        </div>
                        <div id="testiContainer" class="mb-4"></div>

                        <button type="submit" class="btn btn-success w-100">Salva item</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODALE OPERE DEL MUSEO ============ -->
    <div class="modal fade" id="modalItems" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Item del museo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <button class="btn btn-success w-100 mb-3" onclick="passaANuovoItem()">
                        <i class="bi bi-plus-lg me-2"></i>Nuovo item
                    </button>
                    <div id="listaItemsMuseo"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODALE PERCORSI DEL MUSEO ============ -->
    <div class="modal fade" id="modalVisite" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Percorsi del museo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <a id="btnNuovoPercorso" href="#" class="btn btn-success w-100 mb-3">
                        <i class="bi bi-plus-lg me-2"></i>Nuovo percorso
                    </a>
                    <div id="listaVisiteMuseo"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sessione.js"></script>
    <script src="app.js"></script>
</body>
</html>
