<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="stile.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-primary mb-5">
        <div class="container">
            <span class="navbar-brand mb-0 h1">ArtAround</span>
            <div id="userBox" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <div class="container">

        <!-- ============ VISTA AUTORE ============ -->
        <div id="sezioneAutore" style="display: none;">
            <div class="section-head d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
                <div>
                    <div class="eyebrow">Catalogo</div>
                    <h1 class="section-title">Musei</h1>
                    <p class="section-sub mb-0 mt-2"><span id="countMusei">0</span> musei nel catalogo condiviso.</p>
                </div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuovoMuseo">
                    <i class="bi bi-plus-lg me-2"></i>Aggiungi museo
                </button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-4">Museo</th>
                                <th>Città</th>
                                <th class="text-end pe-4">Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="listaMusei">
                            <tr>
                                <td colspan="3" class="text-center py-5 text-muted">Caricamento musei…</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ============ VISTA VISITATORE ============ -->
        <div id="sezioneVisitatore" style="display: none;">
            <div class="section-head mb-4">
                <h1 class="section-title">Visite guidate</h1>
                <p class="section-sub mb-0 mt-2">Scegli un percorso, sbloccalo e inizia la visita dal tuo dispositivo.</p>
            </div>

            <div class="row g-4" id="listaVisite">
                <div class="col-12 text-muted">Caricamento percorsi…</div>
            </div>
        </div>
    </div>

    <!-- ============ MODALE NUOVO MUSEO ============ -->
    <div class="modal fade" id="modalNuovoMuseo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuovo museo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formMuseo">
                        <div class="mb-3">
                            <label class="form-label">Nome del museo</label>
                            <input type="text" id="nomeMuseo" class="form-control" placeholder="es. Galleria Borghese" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Città</label>
                            <input type="text" id="cittaMuseo" class="form-control" placeholder="es. Roma" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Salva museo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODALE TAPPE DI UNA VISITA (vetrina visitatore) ============ -->
    <div class="modal fade" id="modalTappe" tabindex="-1">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titoloTappe">Tappe del percorso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ol class="mb-0 ps-3" id="elencoTappe"></ol>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ MODALE PERCORSI DEL MUSEO ============ -->
    <div class="modal fade" id="modalVisite" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">I tuoi percorsi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <a id="btnNuovoPercorso" href="#" class="btn btn-success w-100 mb-3">
                        <i class="bi bi-plus-lg me-2"></i>Nuovo percorso
                    </a>
                    <div id="listaVisiteMuseo"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sessione.js"></script>
    <script src="app.js"></script>
</body>
</html>
