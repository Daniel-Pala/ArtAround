<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtAround</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="stile.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-bank2 me-2"></i>ArtAround</span>
            <div id="userBox" class="d-flex align-items-center">
                </div>
        </div>
    </nav>

    <div class="container">
        <div id="sezioneAutore" style="display: none;">
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card stats-card shadow-sm p-3">
                        <div class="text-muted small uppercase fw-bold">Musei Gestiti</div>
                        <div class="h3 mb-0" id="countMusei">0</div>
                    </div>
                </div>
                <div class="col-md-8 text-end d-flex align-items-center justify-content-end gap-2">
                    <button class="btn btn-success btn-lg shadow-sm" data-bs-toggle="modal" data-bs-target="#modalNuovoMuseo">
                        <i class="bi bi-plus-circle me-2"></i>Aggiungi Nuovo Museo
                    </button>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 text-dark">I tuoi Musei</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Museo</th>
                                    <th>Città</th>
                                    <th class="text-end pe-4">Azioni</th>
                                </tr>
                            </thead>
                            <tbody id="listaMusei">
                                <tr>
                                    <td colspan="3" class="text-center py-5 text-muted">
                                        <div class="spinner-border spinner-border-sm me-2"></div>
                                        Caricamento musei...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div> </div>

        <div id="sezioneVisitatore" style="display: none;">
            <div class="row mb-4">
                <div class="col-12">
                    <h2 class="mb-1">Scopri i Percorsi</h2>
                    <p class="text-muted">Esplora le visite guidate create dai nostri esperti</p>
                </div>
            </div>

            <div class="row" id="listaVisite">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border spinner-border-sm me-2"></div>
                    Caricamento percorsi...
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuovoMuseo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nuovo Museo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formMuseo">
                        <div class="mb-3">
                            <label class="form-label">Nome Museo</label>
                            <input type="text" id="nomeMuseo" class="form-control" placeholder="es. Galleria Borghese" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Città</label>
                            <input type="text" id="cittaMuseo" class="form-control" placeholder="es. Roma" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salva Museo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuovaOpera" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Aggiungi Nuova Opera</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
                    <form id="formOpera">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Titolo Opera</label>
                            <input type="text" id="operaTitolo" class="form-control" placeholder="es. Ritratto di Giulio II" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">ID Wikidata</label>
                            <input type="text" id="operaWikidata" class="form-control" placeholder="es. Q126599960" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Licenza</label>
                            <select id="operaLicenza" class="form-select" required>
                                <option value="">Seleziona una licenza</option>
                                <option value="CC-BY">CC-BY</option>
                                <option value="CC-BY-SA">CC-BY-SA</option>
                                <option value="CC0">CC0 (Pubblico Dominio)</option>
                                <option value="Proprietaria">Proprietaria</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Prezzo (€)</label>
                            <input type="number" id="operaPrezzo" class="form-control" min="0" step="0.01" value="0">
                        </div>
                        <div class="footer-modal mt-4">
                            <button type="submit" class="btn btn-primary w-100">Salva Opera</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sessione.js"></script>
    <script src="app.js"></script>
</body>
</html>
