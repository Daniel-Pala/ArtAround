<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codici QR — ArtAround</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="stile.css">
    <style>
        .cartellino {
            aspect-ratio: 1;
            border: 1px solid #212529;
            background: #fff;
            padding: .75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            break-inside: avoid;
        }
        .cartellino img { flex: 1; min-height: 0; max-width: 100%; object-fit: contain; }
        .cartellino .titolo { font-size: .8rem; font-weight: 600; text-align: center; margin-top: .5rem; }
        .cartellino .codice { font-size: .7rem; color: #6c757d; }

        /* il bottone di stampa compare passando sopra al cartellino */
        .cartellino .btn-stampa { position: absolute; top: .5rem; right: 1.25rem; opacity: 0; transition: opacity .15s; }
        .col-cartellino:hover .btn-stampa, .btn-stampa:focus { opacity: 1; }

        @media print {
            .navbar, .no-stampa, .btn-stampa { display: none; }
            body { background: #fff; }
            /* stampando un singolo cartellino gli altri restano fuori dal foglio */
            body.solo-uno .col-cartellino:not(.da-stampare) { display: none; }
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand mb-0 h1 text-decoration-none" href="index.html">ArtAround</a>
            <div id="userBox" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="no-stampa d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
            <h2 class="mb-0" id="titoloPagina">Codici QR</h2>
            <div class="d-flex gap-2">
                <input type="search" id="ricerca" class="form-control" placeholder="Cerca un'opera..." style="min-width:16rem">
                <button class="btn btn-primary text-nowrap" onclick="window.print()">
                    <i class="bi bi-printer me-1"></i>Stampa tutto
                </button>
            </div>
        </div>

        <div class="row g-3" id="listaQr"></div>
        <p class="text-muted no-stampa d-none" id="nessunRisultato">Nessuna opera con questo nome.</p>

    </div>

    <script src="sessione.js"></script>
    <script src="qr.js"></script>
</body>
</html>
