<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR code delle opere — ArtAround</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="stile.css">
    <style>
        /* i cartellini vanno ritagliati, quindi bordo tratteggiato e mai spezzati a meta' */
        .cartellino {
            border: 1px dashed #adb5bd;
            border-radius: .5rem;
            padding: 1rem;
            text-align: center;
            break-inside: avoid;
        }
        .cartellino img { width: 100%; max-width: 160px; }

        @media print {
            /* in stampa restano solo i cartellini: via barra, intestazione e bottoni */
            .navbar, .no-stampa { display: none; }
            body { background: #fff; }
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">ArtAround</span>
            <div id="userBox" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <div class="container pb-5">

        <div class="no-stampa d-flex justify-content-between align-items-start mb-4">
            <div>
                <a href="index.html" class="text-decoration-none small">&larr; Torna ai musei</a>
                <h2 class="mb-1 mt-2" id="titoloPagina">QR code delle opere</h2>
                <p class="text-muted mb-0">
                    Stampa questo foglio e appendi ogni cartellino di fianco all'opera.
                    Chi visita inquadra il QR con il Navigator e arriva ai contenuti.
                </p>
            </div>
            <button class="btn btn-primary" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>Stampa
            </button>
        </div>

        <div class="row g-3" id="listaQr"></div>

    </div>

    <script src="sessione.js"></script>
    <script src="qr.js"></script>
</body>
</html>
