<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - ArtAround</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="stile.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <h1 class="text-primary"><i class="bi bi-bank2"></i> ArtAround</h1>
            <p class="text-muted">Accedi al marketplace</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <!-- TAB SWITCHER: Bootstrap gestisce automaticamente il cambio tab -->
                <ul class="nav nav-pills nav-justified mb-4" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabLogin">Login</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabRegister">Registrati</button>
                    </li>
                </ul>

                <!-- BOX MESSAGGI: lo riempiamo via JS quando c'è errore o successo -->
                <div id="messaggio"></div>

                <div class="tab-content">

                    <!-- ============ FORM LOGIN ============ -->
                    <div class="tab-pane fade show active" id="tabLogin">
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" id="loginUsername" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="loginPassword" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Accedi
                            </button>
                        </form>
                    </div>

                    <!-- ============ FORM REGISTRAZIONE ============ -->
                    <div class="tab-pane fade" id="tabRegister">
                        <form id="formRegister">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" id="regUsername" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" id="regPassword" class="form-control" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ruolo</label>
                                <select id="regRuolo" class="form-select">
                                    <option value="autore">Autore (creo contenuti)</option>
                                    <option value="visitatore">Visitatore (sfoglio e compro)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-person-plus me-2"></i>Crea Account
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sessione.js"></script>
</body>
</html>
